name: Feature or spec
description: Propose a behavior change or a written spec.
title: "[Spec]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        State the problem, the goal, and how we will know the work is done.
        Specs do not require code. Security vulnerabilities use https://github.com/ShaftHQ/chaosengine-harness/security/advisories/new — not this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or wrong today, and who hits it (tester, frontend, backend, product owner, scrum master).
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done. Name non-goals if a reader might assume them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checks a reviewer can apply. Include commands and expected results when the change is code.
    validations:
      required: true
  - type: textarea
    id: agent_brief
    attributes:
      label: Agent brief
      description: |
        Optional. Steps a fresh agent can run from this issue and the repo alone: inspect and confirm, fix, verify, finalize. Verify maps 1:1 to each defect and each SC-* item. No new required field.
    validations:
      required: false
  - type: checkboxes
    id: finalization
    attributes:
      label: Definition of done
      description: Every spec or epic finishes with this step. Leave it unchecked until the work is finalized.
      options:
        - label: "Finalization: delete every temporary branch created for this spec (feature, research/attachment, experiment branches). Before deleting a research/attachment branch, move its referenced files to main (e.g. docs/research/<date>-<slug>/) and update the issue links, so nothing breaks."
          required: false
