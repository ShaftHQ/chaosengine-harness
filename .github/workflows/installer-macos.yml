name: install-macos

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  installer:
    if: contains(github.event.pull_request.labels.*.name, 'ci:installer-macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Offline installer tests
        run: python -m pytest -q -p no:cacheprovider tests/installer
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"
      - name: Hook parity offline pin and installer surfaces
        run: python -m pytest -v -p no:cacheprovider tests/installer/test_hook_parity.py
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Hook parity OpenCode trace Cursor and exit-2 fixtures
        run: python -m pytest -v -p no:cacheprovider tests/scripts/test_hook_parity.py tests/scripts/test_chaos_engine_exit2_fidelity.py tests/scripts/test_chaos_engine_kernel.py
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"
