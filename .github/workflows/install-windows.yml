name: install-windows

on:
  push:
    branches: [main, ChaosEngine/installer-revamp]
  pull_request:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Offline installer tests
        shell: pwsh
        run: |
          $gitBash = "C:\Program Files\Git\bin"
          if (-not (Test-Path -LiteralPath "$gitBash\bash.exe")) {
            throw "Git Bash is required. System32 bash is the WSL stub and writes a UTF-16 install message."
          }
          $env:CHAOS_ENGINE_BASH = "$gitBash\bash.exe"
          python -m pytest -q -p no:cacheprovider tests/installer
          python -m pytest -v -p no:cacheprovider tests/installer/test_hook_parity.py
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Hook parity OpenCode trace Cursor and exit-2 fixtures
        shell: pwsh
        run: python -m pytest -v -p no:cacheprovider tests/scripts/test_hook_parity.py tests/scripts/test_chaos_engine_exit2_fidelity.py tests/scripts/test_chaos_engine_kernel.py
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"
