name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline structure and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Ceiling ratchet
        run: python3 scripts/ci/ceiling_raise.py --base "origin/${{ github.event.pull_request.base.ref || 'main' }}"

      - name: Root layout
        run: |
          set -eu
          for f in skills/chaos-engine/SKILL.md VERSION LICENSE THIRD_PARTY_NOTICES.md \
                   install.sh install.ps1 bootstrap.py install.py tool.py distributions.json; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          test ! -e chaos-engine || { echo "unexpected wrapping chaos-engine/ directory"; exit 1; }
          grep -Eq '^0\.4\.[0-9]{8}\.[0-9]+$' VERSION || { echo "VERSION must be 0.4.YYYYMMDD.n"; exit 1; }
          grep -q "$(cat VERSION)" CHANGELOG.md || { echo "CHANGELOG.md does not mention VERSION $(cat VERSION)"; exit 1; }

      - name: Python syntax
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).split()
          for f in files:
              compile(open(f, "rb").read(), f, "exec")
          print(f"{len(files)} Python files compile")
          PY

      - name: JSON syntax
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.json"):
              if ".git" in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:  # noqa: BLE001
                  bad.append(f"{p}: {exc}")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          PY

      - name: Shell syntax
        run: |
          bash -n install.sh
          sh -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh install.sh
          fi
          python3 scripts/ci/sync_ce_ui.py --check
          python3 scripts/ci/render_brand_mark.py --check

      - name: Markdown relative links
        run: |
          python - <<'PY'
          import os, re, sys
          bad = []
          link = re.compile(r"\]\(([^)\s#]+)(#[^)]*)?\)")
          for dirpath, dirnames, filenames in os.walk("."):
              # vendor/ holds third-party trees with template placeholders; check first-party docs only.
              dirnames[:] = [d for d in dirnames if d != ".git" and not (dirpath == "." and d == "vendor")]
              for name in filenames:
                  if not name.endswith(".md"):
                      continue
                  path = os.path.join(dirpath, name)
                  text = open(path, encoding="utf-8", errors="replace").read()
                  for m in link.finditer(text):
                      target = m.group(1)
                      if re.match(r"[a-zA-Z][a-zA-Z0-9+.-]*:", target) or target.startswith("/") or "{" in target:
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(dirpath, target))):
                          bad.append(f"{path}: {target}")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          PY

      - name: In-tree unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider skills/local-agency/scripts/tests

      - name: Harness tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --quiet pyyaml pytest-xdist
          git config --global user.name "ChaosEngine CI"
          git config --global user.email "chaosengine@mail.grokbot.com"
          python -m pytest -q -p no:cacheprovider -n auto tests

      - name: Hook parity offline pin and installer surfaces
        run: python -m pytest -v -p no:cacheprovider tests/scripts/test_conformance_8052.py tests/installer/test_hook_parity.py

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Hook parity OpenCode trace Cursor and exit-2 fixtures
        run: python -m pytest -v -p no:cacheprovider tests/scripts/test_hook_parity.py tests/scripts/test_chaos_engine_exit2_fidelity.py tests/scripts/test_chaos_engine_kernel.py

      - name: Tool entrypoint smoke
        run: python tool.py --help
